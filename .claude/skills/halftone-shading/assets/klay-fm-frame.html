<!DOCTYPE html>
<!--
  halftone-shading · klay-fm-frame  (THE composed Klay FM frame template)
  A complete, animated Klay FM frame: halftone night-desk scene + motion pass +
  tilt-Klay (the color spot) + a fine-pixel MacBook he types on + the pixel-note
  title. Copy this file to make a new frame. What to edit, in order:
    1) STATIC[]  — the scene: add/move/remove props (each = a tone(x,y) region,
       shade with cyl/cover/bevel from references/technique.md).
    2) ANIM[] + PP — the motion pass: which layers move (drift/oscillate/pulse),
       fps 6, slow & sparse (references/motion.md).
    3) KLAY{}    — Klay's spot + camera azimuth (az). Depth follows facing.
                   Renderer + rules: references/klay-tilt.md.
    4) drawMacbook()/drawArm() — the prop he uses (fine pixels, prop palette).
    5) trackStr / NOTE — the track title + pixel ♪.
  Layer order (back->front): dots -> animated dots -> prop -> arm -> Klay -> title.
  Palette #f5f3ed / #15130d; 6px grid; dot radius <= 1.68px.
-->
<html><head><meta charset="utf-8"><title>Klay FM frame</title>
<style>html,body{margin:0;background:#3a352f;display:grid;place-items:center;min-height:100vh}#stage svg{display:block;width:min(100vw,1280px);height:auto}</style>
</head><body><div id="stage"></div>
<script>
const W=1280,H=720,INK='#15130d',BG='#f5f3ed',SP=6,MAX_R=1.68;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rect=(x,y,x0,y0,x1,y1)=>x>=x0&&x<=x1&&y>=y0&&y<=y1;
const near=(a,b,t)=>Math.abs(a-b)<=t;
const dist=(x,y,cx,cy)=>Math.hypot(x-cx,y-cy);
const edge=(x,y,x0,y0,x1,y1,t=3)=>rect(x,y,x0,y0,x1,y1)&&(near(x,x0,t)||near(x,x1,t)||near(y,y0,t)||near(y,y1,t));
function cyl(x,y,x0,y0,x1,y1){ if(!rect(x,y,x0,y0,x1,y1))return 0; if(edge(x,y,x0,y0,x1,y1))return 0.95; const u=(x-x0)/(x1-x0),v=(y-y0)/(y1-y0); return clamp(0.4+0.5*Math.abs(u-0.3)+v*0.18,0.2,0.9); }
function cover(x,y,x0,y0,x1,y1){ if(!rect(x,y,x0,y0,x1,y1))return 0; if(edge(x,y,x0,y0,x1,y1))return 0.95; if(y<y0+6)return near(x,(x0+x1)/2,20)?0.3:0.38; const v=(y-y0-6)/((y1-y0)-6); if(v<0.14)return 0.35; return clamp(0.5+v*0.28,0.4,0.85); }
const frameR=(x,y)=>rect(x,y,300,58,980,470), paneR=(x,y)=>rect(x,y,326,86,954,444);
const muntin=(x,y)=>near(x,535,7)||near(x,744,7)||near(y,265,7);
function hash(x,y){const s=Math.sin(x*12.9898+y*78.233)*43758.5453;return s-Math.floor(s);}
// ── (5) TITLE — track text (IBM Plex Mono) + a pixel ♪ (copper rects) ──
const FS=18, trackStr=`01 &#8211; Klay FM &#183; Night Desk`;
const trackEl=`<text x="${W-38}" y="56" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="${FS}" fill="${INK}">${trackStr}</text>`;
function rawBox(m){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',W);s.setAttribute('height',H);s.style.cssText='position:absolute;left:-9999px;top:0';s.innerHTML=m;document.body.appendChild(s);const b=s.querySelector('text').getBBox();document.body.removeChild(s);return b;}
const bb=rawBox(trackEl);
const NOTE=['.......cc','......ccc','......c.c','......c..','......c..','......c..','......c..','......c..','.cc...c..','ccccc.c..','cccccc...','cccccc...','.cccc....'], nP=2, nW=9*nP, nH=13*nP;
const nX=bb.x-12-nW, nY=bb.y+(bb.height-nH)/2;
let noteEl=''; NOTE.forEach((row,ry)=>[...row].forEach((cx,ci)=>{ if(row[ci]==='c') noteEl+=`<rect x="${(nX+ci*nP).toFixed(1)}" y="${(nY+ry*nP).toFixed(1)}" width="${nP+0.4}" height="${nP+0.4}" fill="#C27A4A"/>`; }));
const titleEl=trackEl+`<g shape-rendering="crispEdges">${noteEl}</g>`;
const TB={x0:nX-11, y0:Math.min(bb.y,nY)-7, x1:bb.x+bb.width+11, y1:Math.max(bb.y+bb.height,nY+nH)+7};
const inKO=(x,y)=>rect(x,y,TB.x0,TB.y0,TB.x1,TB.y1);
function dot(x,y,tone,size,op){ tone=clamp(tone+(hash(x,y)-0.5)*0.06,0,1); let r=(0.6+tone*3.4)*size; if(r>MAX_R)r=MAX_R; if(r<0.12)return ''; const o=clamp(0.2+0.8*tone,0.06,1)*op; return `<circle cx="${x}" cy="${y}" r="${r.toFixed(2)}" fill="${INK}" fill-opacity="${o.toFixed(2)}"/>`; }
const grain=new Set(); {let gy=566,gap=7; while(gy<694){ grain.add(Math.round((gy-3)/6)*6+3); gy+=gap; gap+=1.7; }}
const FAR=558, LIP=700;
// ── (1) SCENE — each prop is a tone(x,y) layer; foreground wins ──
const STATIC=[
  ['wall',(x,y)=> (y<FAR&&!frameR(x,y)&&!(y>=470&&y<=503))?0.08:0,0.45],
  ['sky',(x,y)=> (paneR(x,y)&&!muntin(x,y))?0.12:0,0.7],
  ['moon',(x,y)=>{ if(!paneR(x,y))return 0; const d=dist(x,y,858,150); if(d<46&&dist(x,y,880,143)>46)return d>40?0.6:0.82; return 0; },0.35],
  ['skyline',(x,y)=>{ if(!paneR(x,y)||muntin(x,y))return 0; const b=Math.floor(x/20); if(((b*37)%100)<24)return 0; const top=444-(28+((b*53)%96)); if(y>=top&&y<=444){ if(near(y,top,3))return 0.5; const wx=Math.floor(x/9),wy=Math.floor(y/9); if(((wx+wy)%3===0)&&((b*7)%2===0))return 0.3; return 0.72;} return 0; },0.55],
  ['muntin',(x,y)=>{ if(!paneR(x,y)||!muntin(x,y))return 0; if(near(x,533,2)||near(y,263,2))return 0.45; return 0.85; },0.3],
  ['frame',(x,y)=>{ if(!frameR(x,y)||paneR(x,y))return 0; if(near(x,326,4)||near(x,954,4)||near(y,86,4)||near(y,444,4))return 0.95; if(near(x,300,4)||near(x,980,4)||near(y,58,4)||near(y,470,4))return 0.5; return 0.78; },0.35],
  ['sill',(x,y)=>{ if(!(x>=288&&x<=992))return 0; if(near(y,470,2))return 0.95; if(rect(x,y,288,470,992,503)){const v=(y-470)/33; return clamp(0.45+v*0.4,0.4,0.9);} return 0; },0.25],
  ['desk',(x,y)=>{ if(y<FAR||y>720)return 0; if(near(y,FAR,2))return 0.85; if(y>=LIP)return near(y,LIP,2)?0.9:0.72; return grain.has(y)?0.5:0.28; },0.3],
  ['lamp',(x,y)=>{ if(rect(x,y,864,420,948,448)){ if(near(y,420,4))return 0.9; if(near(y,448,3))return 0.4; const v=(y-420)/28; return clamp(0.75-v*0.4,0.35,0.85);} if(near(x,905,3)&&y>=448&&y<=566)return 0.85; const b=cyl(x,y,858,566,952,578); if(b)return b; return 0; },0.3],
  ['books',(x,y)=>{ if(near(y,582,2)||near(y,556,2))return 0.9; return Math.max(cover(x,y,336,582,474,612),cover(x,y,346,556,466,582),cover(x,y,356,532,456,556)); },0.35],
  ['mug',(x,y)=>{ if(rect(x,y,788,626,856,634))return 0.95; if(rect(x,y,792,628,852,632))return 0.35; const c=cyl(x,y,786,634,858,688); if(c)return c; return 0; },0.3],
];
let staticDots='';
for(let x=SP/2;x<W;x+=SP) for(let y=SP/2;y<H;y+=SP){ if(inKO(x,y))continue; for(let i=STATIC.length-1;i>=0;i--){const t=STATIC[i][1](x,y); if(t>0){staticDots+=dot(x,y,t,STATIC[i][2],1);break;}} }
// ── (2) MOTION — movers only (locked pace fps 6, slow/sparse) ──
const PP={fps:6,rain:{speed:10,dens:2,len:402,size:0.65},lamp:{speed:6.5,amp:0.4,size:0.3},steam:{size:0.3}};
const rainT =(x,y,t)=>{ if(!paneR(x,y)||muntin(x,y)||y>=PP.rain.len)return 0; const yy=y+Math.floor(t*PP.rain.speed); return ((x*3+yy*7)%74)<PP.rain.dens?0.4:0; };
const steamT=(x,y,t)=>{ if(y<588||y>626)return 0; const ph=(t*16)%36; if(((626-y+ph)%6)>2)return 0; const wob=Math.sin(y*0.25+t*1.6)*4; if(near(x,808+wob,2)||near(x,824-wob,2)){ const fade=clamp((y-588)/36,0,1); return 0.65*fade; } return 0; };
const glowT =(x,y,t)=>{ const d=dist(x,y,906,434); if(d>15)return 0; return clamp((1-d/15)*(0.24+PP.lamp.amp*Math.sin(t*PP.lamp.speed)),0,0.42); };
const ANIM=[[rainT,PP.rain.size],[steamT,PP.steam.size],[glowT,PP.lamp.size]];
// ── (3) KLAY — tilt renderer (see references/klay-tilt.md) ──
const KM='#A8969E', KOL='#8BA32E', KLM='#C2D64A', KK='#1B1B18';
function klerp(a,b,t){const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('');}
const KR=(x,y,w,h,f)=> (w>0.4&&h>0.4)?`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(w+0.6).toFixed(1)}" height="${(h+0.6).toFixed(1)}" fill="${f}"/>`:'';
function klayTilt(azDeg,{U,cx,groundY,potDepth=1.6,legDepth=0.6,blink=false}){
  const aa=Math.sin(azDeg*Math.PI/180), t=Math.abs(aa), sideLeft=aa>=0;
  const potX0=cx-3*U, potW=6*U, ux=i=>potX0+i*U, yTop=r=>groundY-(8-r)*U;
  const w=Math.min(potW,t*potDepth*U), legDW=Math.min(U,t*legDepth*U);
  const dM=klerp(KM,'#5f545b',0.35+0.65*t), dO=klerp(KOL,'#586a1e',0.35+0.65*t);
  const band=(x,y,w0,h,lt,dk)=>{ if(w<=0.1)return KR(x,y,w0,h,lt); if(sideLeft){const dl=Math.max(0,Math.min(w0,(potX0+w)-x));return KR(x,y,dl,h,dk)+KR(x+dl,y,w0-dl,h,lt);} const dl=Math.max(0,Math.min(w0,(x+w0)-(potX0+potW-w)));return KR(x,y,w0-dl,h,lt)+KR(x+w0-dl,y,dl,h,dk); };
  const slice=(x,y,w0,h,lt,dk)=>{ if(legDW<=0.1)return KR(x,y,w0,h,lt); const dw=Math.min(w0,legDW); return sideLeft?KR(x,y,dw,h,dk)+KR(x+dw,y,w0-dw,h,lt):KR(x,y,w0-dw,h,lt)+KR(x+w0-dw,y,dw,h,dk); };
  let o=band(potX0,yTop(4),potW,3*U,KM,dM);
  o+=slice(ux(1),yTop(7),U,U,KM,dM)+slice(ux(4),yTop(7),U,U,KM,dM);
  o+=slice(ux(3),yTop(3),U,U,KOL,dO);
  o+=KR(ux(2),yTop(2),U*3,U,KLM)+KR(ux(3),yTop(1),U,U,KLM);
  if(!blink){ const shift=aa*U*0.9, cl=x=>Math.max(potX0,Math.min(potX0+potW-U,x)); o+=KR(cl(ux(1)+shift),yTop(5),U,U,KK)+KR(cl(ux(4)+shift),yTop(5),U,U,KK); }
  return o;
}
const KLAY={U:18, cx:558, groundY:648, az:20};   // az>0 = turned right (toward the laptop)
// ── (4) PROP he uses — fine-pixel MacBook + one-square typing arm ──
function drawArm(t){ const m='#A8969E',d='#8F8088'; const tap=Math.floor(t*4)%2, ax=600, ay=628+(tap?0:8); return `<rect x="${ax}" y="${ay}" width="18.6" height="18.6" fill="${m}"/><rect x="${ax}" y="${ay+15}" width="18.6" height="4" fill="${d}"/>`; }
const LX=598, LY=560, LP=9;
function drawMacbook(){
  const sil='#CFC9BE', silD='#A9A399', silDD='#8b867d', disp='#26262b', gl='#37506b', key='#9a958c', tp='#B7B1A7';
  const r=(cx,cy,w,h,f)=>`<rect x="${(LX+cx*LP).toFixed(1)}" y="${(LY+cy*LP).toFixed(1)}" width="${(w*LP+0.6).toFixed(1)}" height="${(h*LP+0.6).toFixed(1)}" fill="${f}"/>`;
  let o=r(2,0,12,1,sil)+r(2,6,12,1,silD)+r(2,1,1,5,sil)+r(13,1,1,5,silD)+r(3,1,10,5,disp)+r(3,1,10,1.6,gl);
  for(let row=7;row<=10;row++){ const sp=row-7; o+=r(2-sp,row,12+2*sp,1,row===7?silD:sil); }
  o+=r(-1,11,17,1,silDD);
  for(let k=0;k<7;k++) o+=r(3+k*1.4,8,0.9,0.7,key);
  for(let k=0;k<8;k++) o+=r(2+k*1.5,9,0.9,0.7,key);
  o+=r(6.5,10,4,0.9,tp);
  return o;
}
// ── compose: dots -> animated dots -> prop -> arm -> Klay -> title ──
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.style.background=BG;
svg.innerHTML=`<g>${staticDots}</g><g id="an"></g><g id="lap" shape-rendering="crispEdges"></g><g id="arm" shape-rendering="crispEdges"></g><g id="klay" shape-rendering="crispEdges"></g>${titleEl}`;
document.getElementById('stage').appendChild(svg);
const an=svg.querySelector('#an'), lap=svg.querySelector('#lap'), arm=svg.querySelector('#arm'), kl=svg.querySelector('#klay');
lap.innerHTML=drawMacbook();
let last=0;
function loop(ms){ const t=ms/1000;
  if(ms-last>1000/PP.fps){ last=ms; let d=''; for(let x=SP/2;x<W;x+=SP) for(let y=SP/2;y<H;y+=SP){ if(inKO(x,y))continue; for(const [fn,size] of ANIM){ const tn=fn(x,y,t); if(tn>0){ d+=dot(x,y,tn,size,1); break; } } } an.innerHTML=d; arm.innerHTML=drawArm(t); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
const KF=[{b:false,ms:2600},{b:true,ms:150},{b:false,ms:2000},{b:true,ms:150}]; let ki=0;
function ktick(){ kl.innerHTML=klayTilt(KLAY.az,{U:KLAY.U,cx:KLAY.cx,groundY:KLAY.groundY,blink:KF[ki].b}); const ms=KF[ki].ms; ki=(ki+1)%KF.length; setTimeout(ktick,ms); }
ktick();
</script>
</body></html>
