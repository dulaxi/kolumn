<!DOCTYPE html>
<!--
  halftone-shading · scene-kit  (THE engine + pattern library — copy & fill)
  Everything above the "▼▼▼ SCENE ▼▼▼" line is the reusable engine: the dot
  renderer (6px grid, r<=1.68 cap, tone->size+opacity, jitter), the form-shaded
  PATTERN LIBRARY, the measured pixel-note title, and the static/animated render
  loop. You should NOT need to touch it. Below the line you declare the scene as
  data: LAYERS (tone functions, back->front) + OVERLAYS (per-frame draw fns) +
  CONFIG. Run `node --check` on your script before viewing — one parse error
  blanks the whole frame.
  Rules: one 6px grid, r<=1.68, per-item form-shading (implied light upper-left,
  NOT a global scene light), monochrome dots + color reserved for the subject.
-->
<html><head><meta charset="utf-8"><title>Halftone scene-kit</title>
<style>html,body{margin:0;background:#3a352f;display:grid;place-items:center;min-height:100vh}#stage svg{display:block;width:min(100vw,1280px);height:auto}</style>
</head><body><div id="stage"></div>
<script>
// ═══════════════ ENGINE (don't edit) ═══════════════
const W=1280,H=720,INK='#15130d',BG='#f5f3ed',SP=6,MAXR=1.68;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, near=(a,b,t)=>Math.abs(a-b)<=t, dist=(x,y,cx,cy)=>Math.hypot(x-cx,y-cy);
const rect=(x,y,x0,y0,x1,y1)=>x>=x0&&x<=x1&&y>=y0&&y<=y1, inR=rect;
const ell=(x,y,cx,cy,rx,ry)=>((x-cx)/rx)**2+((y-cy)/ry)**2;
const edge=(x,y,x0,y0,x1,y1,t=3)=>rect(x,y,x0,y0,x1,y1)&&(near(x,x0,t)||near(x,x1,t)||near(y,y0,t)||near(y,y1,t));
function hash(x,y){const s=Math.sin(x*12.9898+y*78.233)*43758.5453;return s-Math.floor(s);}
function dot(x,y,tone,size=0.55){ tone=clamp(tone+(hash(x,y)-0.5)*0.06,0,1); let r=(0.6+tone*3.4)*size; if(r>MAXR)r=MAXR; if(r<0.12)return ''; const o=clamp(0.2+0.8*tone,0.06,1); return `<circle cx="${x}" cy="${y}" r="${r.toFixed(2)}" fill="${INK}" fill-opacity="${o.toFixed(2)}"/>`; }
// form(): per-object lambert shading from an implied upper-left-front light. THIS is the "not crude" trick.
function form(nx,ny,nz){ const lam=clamp(nx*-0.5+ny*-0.55+nz*0.67,-0.25,1); return clamp(0.9-lam*0.95,0.04,0.95); }

// ─── PATTERN LIBRARY (form-shaded; see references/technique.md) ───
function sphere(x,y,cx,cy,r){ const nx=(x-cx)/r,ny=(y-cy)/r,d2=nx*nx+ny*ny; if(d2>1)return 0; const nz=Math.sqrt(1-d2); let t=form(nx,ny,nz); if(d2>0.72&&ny>0.2)t=clamp(t-0.22,0.04,0.95); return t; }   // reflected-light rim = roundness
function cylV(x,y,x0,y0,x1,y1){ const cx=(x0+x1)/2,r=(x1-x0)/2,rye=Math.max(6,r*0.32);
  if(ell(x,y,cx,y0,r,rye)<=1) return ell(x,y,cx,y0,r,rye)>0.72?0.86:0.3;                                   // round top face (the 3D tell)
  if(x>=x0&&x<=x1&&y>y0&&y<=y1){ const nx=(x-cx)/r; if(Math.abs(nx)>1)return 0; const nz=Math.sqrt(1-nx*nx); let t=clamp(0.87-clamp(nx*-0.6+nz*0.8,-0.2,1)*0.9,0.06,0.93); if(ell(x,y,cx,y1,r,rye*0.85)<=1&&y>y1-5&&ell(x,y,cx,y1,r,rye*0.85)>0.7)t=0.92; return t; } return 0; }
function cone(x,y,cx,apexY,baseY,r){ const rye=r*0.32; if(ell(x,y,cx,baseY,r,rye)<=1&&y>baseY-rye&&ell(x,y,cx,baseY,r,rye)>0.72)return 0.9;
  if(y<apexY||y>baseY)return 0; const f=(y-apexY)/(baseY-apexY),half=r*f; if(Math.abs(x-cx)>half)return 0; const nx=(x-cx)/(half||1),nz=Math.sqrt(Math.max(0,1-nx*nx)); let t=clamp(0.86-clamp(nx*-0.6+nz*0.7,-0.2,1)*0.74,0.1,0.92); if(Math.abs(x-cx)>half-2)t=0.9; return t; }
function isoBox(x,y,cx,topY,hw){ const hh=hw*0.5,rcy=topY+hh,Hh=hw*1.05;
  if((Math.abs(x-cx)/hw+Math.abs(y-rcy)/hh)<=1)return (Math.abs(x-cx)/hw+Math.abs(y-rcy)/hh)>0.9?0.7:0.3;
  if(x>=cx-hw&&x<=cx){ const et=rcy+((x-cx+hw)/hw)*hh; if(y>=et&&y<=et+Hh)return (near(x,cx-hw,2)||near(x,cx,2)||near(y,et+Hh,2))?0.85:0.52; }
  if(x>cx&&x<=cx+hw){ const et=rcy+hh-((x-cx)/hw)*hh; if(y>=et&&y<=et+Hh)return (near(x,cx+hw,2)||near(y,et+Hh,2))?0.85:0.78; } return 0; }
function mug(x,y,cx,topY,r){ const rim=ell(x,y,cx,topY,r,10); if(rim<=1&&y<topY+10){ if(rim>0.66)return 0.9; if(rim>0.32)return 0.14; return 0.5; }
  const bot=topY+94; if(x>=cx-r&&x<=cx+r&&y>topY&&y<=bot){ const nx=(x-cx)/r; if(Math.abs(nx)<=1){ const nz=Math.sqrt(1-nx*nx); let t=clamp(0.87-clamp(nx*-0.6+nz*0.8,-0.2,1)*0.9,0.06,0.93); if(ell(x,y,cx,bot,r,9)<=1&&y>bot-5&&ell(x,y,cx,bot,r,9)>0.7)t=0.92; return t; } }
  const dh=dist(x,y,cx+r+11,topY+44); if(dh>=13&&dh<=25&&x>cx+r-3){ const inner=(dh-13)/12; return clamp(0.55+Math.abs(inner-0.5)*0.5,0.45,0.9); } return 0; }
function cloud(x,y,B){ let inside=false,lit=0; for(const [cx,cy,r] of B){ if(dist(x,y,cx,cy)<=r&&y<=Math.max(...B.map(b=>b[1]))+2){ inside=true; lit=Math.max(lit,1-dist(x,y,cx-r*0.3,cy-r*0.45)/r); } } if(!inside)return 0; return clamp(0.5-lit*0.34,0.16,0.55)*(0.9+0.18*hash(x,y)); }
function tree(x,y,cx,baseY){ if(Math.abs(x-cx)<6&&y>=baseY-60&&y<=baseY)return clamp(0.5+((x-cx)/6)*0.25,0.4,0.75);
  const B=[[cx,baseY-90,40],[cx-28,baseY-76,30],[cx+28,baseY-78,30],[cx-14,baseY-112,26],[cx+16,baseY-114,24]]; let inside=false,sh=0;
  for(const [bx,by,r] of B){ const d=dist(x,y,bx,by); if(d<=r){ inside=true; const l=1-dist(x,y,bx-r*0.4,by-r*0.4)/(r*1.35); sh=Math.max(sh,clamp(0.66-l*0.46,0.14,0.72)); } } if(!inside)return 0; return hash(x,y)>0.7?clamp(sh+0.18,0,0.9):sh; }
function record(x,y,cx,cy,r){ const e=ell(x,y,cx,cy,r,r*0.96); if(e>1)return 0; const rr=Math.sqrt(e); if(rr<0.15)return 0.85; if(near(rr,0.19,0.03))return 0.4; return (Math.floor(rr*24)%2)?0.55:0.3; }
function stoneFace(x,y,x0,y0){ const row=Math.floor((y-y0)/16),off=(row%2)*15,bx=(((x-x0+off)%30)+30)%30,by=(y-y0)%16; if(bx<1.6||by<1.6)return 0.72; return clamp(0.3+((bx-15)/15)*0.12+hash(Math.floor(x/6),Math.floor(y/6))*0.06,0.26,0.5); }
function wall(x,y,x0,x1,top,bot){ if(x<x0||x>x1||y<top||y>bot)return 0; if(near(y,top,2)||near(x,x0,2)||near(x,x1,2)||near(y,bot,2))return 0.88; return stoneFace(x,y,x0,top); }
// flat helpers
function cover(x,y,x0,y0,x1,y1){ if(!rect(x,y,x0,y0,x1,y1))return 0; if(edge(x,y,x0,y0,x1,y1))return 0.95; const v=(y-y0)/((y1-y0)||1); return clamp(0.45+v*0.28,0.4,0.8); }
function bevel(x,y,x0,y0,x1,y1,ix0,iy0,ix1,iy1){ if(!rect(x,y,x0,y0,x1,y1))return 0; if(near(x,ix0,4)||near(x,ix1,4)||near(y,iy0,4)||near(y,iy1,4))return 0.95; if(near(x,x0,4)||near(x,x1,4)||near(y,y0,4)||near(y,y1,4))return 0.5; return 0.78; }

// title (measured knockout + pixel note)
function buildTitle(trackStr,noteX){ const trackEl=`<text x="${W-38}" y="56" text-anchor="end" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="18" fill="${INK}">${trackStr}</text>`;
  const N=['.......cc','......ccc','......c.c','......c..','......c..','......c..','......c..','......c..','.cc...c..','ccccc.c..','cccccc...','cccccc...','.cccc....']; let note='';
  N.forEach((r,ry)=>[...r].forEach((_,ci)=>{ if(r[ci]==='c') note+=`<rect x="${noteX+ci*2}" y="${46+ry*2}" width="2.4" height="2.4" fill="#C27A4A"/>`; }));
  return trackEl+`<g shape-rendering="crispEdges">${note}</g>`; }

// render engine: LAYERS[i]=[name, tone(x,y)->0..1, size] (later index = foreground)
function renderStatic(LAYERS,skip){ let d=''; for(let x=SP/2;x<W;x+=SP) for(let y=SP/2;y<H;y+=SP){ if(skip&&skip(x,y))continue; for(let i=LAYERS.length-1;i>=0;i--){ const t=LAYERS[i][1](x,y); if(t>0){ d+=dot(x,y,t,LAYERS[i][2]??0.55); break; } } } return d; }
function run(CFG){
  const staticDots=renderStatic(CFG.LAYERS, CFG.skip);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.style.background=BG;
  svg.innerHTML=`<g>${staticDots}</g>`+ (CFG.OVERLAYS||[]).map((_,i)=>`<g id="ov${i}" shape-rendering="crispEdges"></g>`).join('') + (CFG.title||'');
  document.getElementById('stage').appendChild(svg);
  const gs=(CFG.OVERLAYS||[]).map((_,i)=>svg.querySelector('#ov'+i));
  const fps=CFG.fps||6; let last=0;
  function loop(ms){ const t=ms/1000; if(ms-last>1000/fps){ last=ms; (CFG.OVERLAYS||[]).forEach((fn,i)=>gs[i].innerHTML=fn(t)); } requestAnimationFrame(loop); }
  if((CFG.OVERLAYS||[]).length) requestAnimationFrame(loop);
}

// ═══════════════ ▼▼▼ SCENE (edit below) ▼▼▼ ═══════════════
// Demo: a little still-life proving the patterns. Replace with your scene.
const HILL=y0=>x=>500; // flat ground demo
const LAYERS=[
  ['sky',(x,y)=> y<500?0:0, 0.5],
  ['ground',(x,y)=> y>=500? (((y-500)%18<2)?0.5:0.14):0, 0.4],
  ['sun',(x,y)=> sphere(x,y,250,150,52), 0.5],
  ['treeL',(x,y)=> tree(x,y,180,500), 0.45],
  ['barrel',(x,y)=> cylV(x,y,540,300,660,470), 0.45],
  ['tent',(x,y)=> cone(x,y,860,250,470,120), 0.45],
  ['crate',(x,y)=> isoBox(x,y,1080,320,70), 0.45],
  ['mug',(x,y)=> mug(x,y,430,430,34), 0.4],
  ['wall',(x,y)=> wall(x,y,300,420,430,500), 0.4],
];
run({ LAYERS, title: buildTitle('00 &#8211; Klay FM &#183; scene-kit', 1002) });
</script>
</body></html>
