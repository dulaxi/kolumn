<!DOCTYPE html>
<!--
  halftone-shading · mixer
  Same scene as scene-template.html, plus a live control panel: one global
  spacing slider + per-layer size/opacity. Tune, then "Copy settings" to get
  JSON you paste into scene-template.html's CFG. Size 0 = whitespace (omit).
-->
<html><head><meta charset="utf-8"><title>Halftone mixer</title>
<style>
  body{margin:0;font-family:'IBM Plex Mono',monospace;background:#e9e6df;color:#15130d}
  #wrap{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap}
  #panel{flex:0 0 300px;max-height:92vh;overflow-y:auto;border:1px solid #cfc9be;border-radius:10px;padding:12px 14px;background:#fff}
  #preview{flex:1;min-width:460px}
  #stage svg{border:1px solid #cfc9be;border-radius:10px;width:100%;height:auto;display:block}
  .head{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#666;margin:8px 0}
  .row{padding:7px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
  .name{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.name b{font-weight:400;color:#aaa}
  .ctl{display:grid;grid-template-columns:32px 1fr 34px;align-items:center;gap:6px}
  .ctl label{font-size:10px;color:#888}.ctl .val{font-size:10px;color:#555;text-align:right}.ctl input{width:100%}
  #bar{display:flex;gap:8px;margin:10px 0}#bar button{font:11px 'IBM Plex Mono',monospace;padding:6px 10px;border:1px solid #15130d;border-radius:8px;background:#15130d;color:#fff;cursor:pointer}
  #bar button.ghost{background:#fff;color:#15130d}#out{width:100%;height:80px;font:10px monospace;margin-top:8px;display:none}
</style></head><body>
<div id="wrap"><div id="panel"></div><div id="preview"><div id="stage"></div></div></div>
<script>
const W=1280,H=720,BG='#f5f3ed',INK='#15130d',MAX_R=1.68;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rect=(x,y,x0,y0,x1,y1)=>x>=x0&&x<=x1&&y>=y0&&y<=y1;
const near=(a,b,t)=>Math.abs(a-b)<=t;
const dist=(x,y,cx,cy)=>Math.hypot(x-cx,y-cy);
const edge=(x,y,x0,y0,x1,y1,t=3)=>rect(x,y,x0,y0,x1,y1)&&(near(x,x0,t)||near(x,x1,t)||near(y,y0,t)||near(y,y1,t));
function cyl(x,y,x0,y0,x1,y1){ if(!rect(x,y,x0,y0,x1,y1))return 0; if(edge(x,y,x0,y0,x1,y1))return 0.95; const u=(x-x0)/(x1-x0),v=(y-y0)/(y1-y0); return clamp(0.4+0.5*Math.abs(u-0.3)+v*0.18,0.2,0.9); }
function cover(x,y,x0,y0,x1,y1){ if(!rect(x,y,x0,y0,x1,y1))return 0; if(edge(x,y,x0,y0,x1,y1))return 0.95; if(y<y0+6)return near(x,(x0+x1)/2,20)?0.3:0.38; const v=(y-y0-6)/((y1-y0)-6); if(v<0.14)return 0.35; return clamp(0.5+v*0.28,0.4,0.85); }
const frameR=(x,y)=>rect(x,y,300,58,980,470), paneR=(x,y)=>rect(x,y,326,86,954,444);
const muntin=(x,y)=>near(x,535,7)||near(x,744,7)||near(y,265,7);
// knockout box measured to hug the title (any length), never hardcoded
const TITLE_STR=`<tspan fill="#C27A4A">&#9834;</tspan>  01 &#8211; Klay FM &#183; Night Desk`;
const TITLE_MARKUP=`<text x="${W-40}" y="76" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="26" fill="${INK}">${TITLE_STR}</text>`;
function measureBox(markup,padX=14,padY=9){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',W);s.setAttribute('height',H);s.style.cssText='position:absolute;left:-9999px;top:0';s.innerHTML=markup;document.body.appendChild(s);const b=s.querySelector('text').getBBox();document.body.removeChild(s);return {x0:b.x-padX,y0:b.y-padY,x1:b.x+b.width+padX,y1:b.y+b.height+padY};}
const TB=measureBox(TITLE_MARKUP);
function hash(x,y){const s=Math.sin(x*12.9898+y*78.233)*43758.5453;return s-Math.floor(s);}

const SECTIONS=[
  {key:'wall',   label:'Wall',      size:0.45,op:0.65,fn:(x,y)=> (y<560&&!frameR(x,y)&&!(y>=470&&y<=503))?0.08:0 },
  {key:'sky',    label:'Sky',       size:0.7, op:0.5, fn:(x,y)=> (paneR(x,y)&&!muntin(x,y))?0.12:0 },
  {key:'moon',   label:'Moon',      size:0.35,op:1,   fn:(x,y)=>{ if(!paneR(x,y))return 0; const d=dist(x,y,858,150); if(d<46&&dist(x,y,880,143)>46)return d>40?0.6:0.82; return 0; } },
  {key:'skyline',label:'Skyline',   size:0.55,op:1,   fn:(x,y)=>{ if(!paneR(x,y)||muntin(x,y))return 0; const b=Math.floor(x/20); if(((b*37)%100)<24)return 0; const top=444-(28+((b*53)%96)); if(y>=top&&y<=444){ if(near(y,top,3))return 0.5; const wx=Math.floor(x/9),wy=Math.floor(y/9); if(((wx+wy)%3===0)&&((b*7)%2===0))return 0.3; return 0.72;} return 0; } },
  {key:'rain',   label:'Rain',      size:0.55,op:0.75,fn:(x,y)=> (paneR(x,y)&&!muntin(x,y)&&y<320&&((x*3+y*7)%74)<3)?0.35:0 },
  {key:'muntin', label:'Muntins',   size:0.3, op:1,   fn:(x,y)=>{ if(!paneR(x,y)||!muntin(x,y))return 0; if(near(x,533,2)||near(y,263,2))return 0.45; return 0.85; } },
  {key:'frame',  label:'Frame',     size:0.35,op:1,   fn:(x,y)=>{ if(!frameR(x,y)||paneR(x,y))return 0; if(near(x,326,4)||near(x,954,4)||near(y,86,4)||near(y,444,4))return 0.95; if(near(x,300,4)||near(x,980,4)||near(y,58,4)||near(y,470,4))return 0.5; return 0.78; } },
  {key:'sill',   label:'Sill',      size:0.25,op:0.85,fn:(x,y)=>{ if(!(x>=288&&x<=992))return 0; if(near(y,470,2))return 0.95; if(rect(x,y,288,470,992,503)){const v=(y-470)/33; return clamp(0.45+v*0.4,0.4,0.9);} return 0; } },
  {key:'desk',   label:'Desk',      size:0.3, op:0.75,fn:(x,y)=>{ if(near(y,560,3))return 0.95; if(y>560){let dk=0.32; if(((y-560)%20)<3)dk=0.55; if(near(y,H-4,4))dk=0.9; return dk;} return 0; } },
  {key:'books',  label:'Book stack',size:0.35,op:1,   fn:(x,y)=>{ if(near(y,528,2)||near(y,502,2))return 0.9; return Math.max(cover(x,y,332,528,470,558),cover(x,y,342,502,462,528),cover(x,y,352,478,452,502)); } },
  {key:'openbk', label:'Open book', size:0.3, op:1,   fn:(x,y)=>{ if(!rect(x,y,480,540,592,558))return 0; const rel=(x-480)/112,tent=540+Math.abs(rel-0.5)*30; if(near(x,536,2))return 0.95; if(near(y,tent,3))return 0.9; if(y<tent)return 0; const line=(Math.floor((y-tent)/4))%2===0&&!near(x,536,6); return line?0.5:0.28; } },
  {key:'cup',    label:'Pencil cup',size:0.3, op:1,   fn:(x,y)=>{ const c=cyl(x,y,606,520,660,558); if(c)return c; for(let px=616;px<=650;px+=10){ if(near(x,px,2)&&y>=496&&y<=520)return y<500?0.95:0.6; } return 0; } },
  {key:'mug',    label:'Mug',       size:0.3, op:1,   fn:(x,y)=>{ if(rect(x,y,780,508,836,516))return 0.95; if(rect(x,y,784,510,832,514))return 0.35; const c=cyl(x,y,778,516,838,558); if(c)return c; if(dist(x,y,842,528)<16&&dist(x,y,842,528)>9)return 0.9; for(let sy=474;sy<506;sy+=6){const wob=Math.sin(sy*0.25)*6; if((near(x,800+wob,2)||near(x,818-wob,2))&&y>=sy&&y<sy+3)return 0.4;} return 0; } },
  {key:'lamp',   label:'Lamp',      size:0.3, op:1,   fn:(x,y)=>{ if(rect(x,y,864,404,948,432)){ if(near(y,404,4))return 0.9; if(near(y,432,3))return 0.4; const v=(y-404)/28; return clamp(0.75-v*0.4,0.35,0.85);} if(dist(x,y,906,442)<14)return clamp(dist(x,y,906,442)/14*0.4,0.08,0.4); if(near(x,905,3)&&y>=432&&y<=548)return 0.85; const b=cyl(x,y,858,548,952,558); if(b)return b; return 0; } },
];
const TITLE={op:1}; let spacing=6, cache={};

function recompute(){ cache={}; for(const s of SECTIONS){ const c=[]; for(let x=spacing/2;x<W;x+=spacing) for(let y=spacing/2;y<H;y+=spacing){ if(rect(x,y,TB.x0,TB.y0,TB.x1,TB.y1))continue; const d=s.fn(x,y); if(d>0)c.push([x,y,d]); } cache[s.key]=c; } }
function render(){
  let dots='';
  for(const s of SECTIONS){ if(s.size<=0||s.op<=0)continue;
    for(const [x,y,d0] of cache[s.key]){ const d=clamp(d0+(hash(x,y)-0.5)*0.06,0,1); let r=(0.6+d*3.4)*s.size; if(r>MAX_R)r=MAX_R; if(r<0.12)continue; const o=clamp(0.2+0.8*d,0.06,1)*s.op; dots+=`<circle cx="${x}" cy="${y}" r="${r.toFixed(2)}" fill="${INK}" fill-opacity="${o.toFixed(2)}"/>`; }
  }
  const title=TITLE.op>0?`<text x="${W-40}" y="76" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="26" fill="${INK}" fill-opacity="${TITLE.op}">${TITLE_STR}</text>`:'';
  document.getElementById('stage').innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="background:${BG}">${dots}${title}</svg>`;
}
let raf; const draw=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render);};
function ctl(lbl,min,max,step,val,fmt,on){const w=document.createElement('div');w.className='ctl';const l=document.createElement('label');l.textContent=lbl;const v=document.createElement('span');v.className='val';v.textContent=fmt(val);const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.oninput=e=>{v.textContent=fmt(+e.target.value);on(+e.target.value);draw();};w.append(l,i,v);return w;}
const panel=document.getElementById('panel');
panel.innerHTML='<div class="head">Global</div>';
panel.append(ctl('space',4,16,1,spacing,x=>x+'px',v=>{spacing=v;recompute();}));
const lh=document.createElement('div');lh.className='head';lh.textContent='Layers';panel.append(lh);
for(const s of SECTIONS){ const row=document.createElement('div');row.className='row'; row.innerHTML=`<div class="name"><span>${s.label}</span><b>${s.key}</b></div>`; row.append(ctl('size',0,2,0.05,s.size,x=>x.toFixed(2),v=>s.size=v)); row.append(ctl('opac',0,1,0.05,s.op,x=>x.toFixed(2),v=>s.op=v)); panel.append(row); }
const tr=document.createElement('div');tr.className='row';tr.innerHTML='<div class="name"><span>Title</span><b>title</b></div>';tr.append(ctl('opac',0,1,0.05,TITLE.op,x=>x.toFixed(2),v=>TITLE.op=v));panel.append(tr);
const bar=document.createElement('div');bar.id='bar';const copy=document.createElement('button');copy.textContent='Copy settings';const reset=document.createElement('button');reset.className='ghost';reset.textContent='Reset';const out=document.createElement('textarea');out.id='out';out.readOnly=true;
copy.onclick=()=>{const cfg={spacing,title:TITLE.op,layers:Object.fromEntries(SECTIONS.map(s=>[s.key,{size:+s.size.toFixed(2),op:+s.op.toFixed(2)}]))};out.value=JSON.stringify(cfg);out.style.display='block';out.select();try{navigator.clipboard.writeText(out.value);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy settings',1200);}catch(e){}};
reset.onclick=()=>location.reload();bar.append(copy,reset);panel.append(bar,out);
recompute();render();
</script></body></html>
